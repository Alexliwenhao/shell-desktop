name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Keep required checks conclusive for documentation-only changes. Workflow
  # path filters can leave required checks pending, so classify inside the run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@v6
        with:
          # GitHub's pull-request merge ref can retain the base branch's
          # submodule gitlink when the PR advances it to a descendant. Check
          # out the actual PR head so pinned submodules match upstream.json.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test scripts/bilingual-docs.test.mjs
          node scripts/verify-bilingual-docs.mjs
          node --test scripts/market-dependency-direction.test.mjs
          node scripts/verify-market-dependency-direction.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            product=true
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            product="$(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs)"
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"

  # Product gate: AA profile smoke is temporarily paused below.
  # A documentation-only change already passed diff validation in `changes`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: needs.changes.outputs.product == 'false'
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.product == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.product == 'true'
        with:
          node-version: 22.23.2
      - if: needs.changes.outputs.product == 'true'
        run: corepack enable
      - name: Resolve Yarn cache folder
        if: needs.changes.outputs.product == 'true'
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: needs.changes.outputs.product == 'true'
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - if: needs.changes.outputs.product == 'true'
        run: yarn install --immutable
      - name: Temporarily skip AA profile smoke in CI
        if: needs.changes.outputs.product == 'true'
        # Remove this step after AA Host service activation is fixed.
        # Local checks and the standalone verify:aa command remain available.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          for (const workspace of ['shell-desktop', 'shell-desktop-beta']) {
            const path = `${workspace}/package.json`
            const manifest = JSON.parse(readFileSync(path, 'utf8'))
            const smoke = ' && yarn run verify:aa'
            if (!manifest.scripts.check.includes(smoke)) throw new Error(`AA check not found in ${workspace}`)
            manifest.scripts.check = manifest.scripts.check.replace(smoke, '')
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE
      - if: needs.changes.outputs.product == 'true'
        run: yarn check

  # Windows-only logic and unsigned NSIS/portable builds on a real Windows runner:
  # updates, window options, pwsh sandbox, volume diagnostics, and packaging.
  # The package gate runs once; both artifacts reuse its build output.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [shell-desktop, shell-desktop-beta]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:win-package
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:win-portable
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.workspace }}/dist/AI-Shell-Desktop-*-x64-Setup.exe
            ${{ matrix.workspace }}/dist/AI-Shell-Desktop-*-x64-Portable.zip

  # macOS-only universal packaging smoke on a real macOS runner: the signed
  # release is built manually on a credentialed machine, so an unsigned DMG
  # here catches Intel and Apple Silicon packaging regressions before a manual
  # release. No signing secrets ever reach this job.
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workspace: [shell-desktop, shell-desktop-beta]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:mac-package
      - name: Build macOS smoke artifact
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:mac-smoke
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-macos-universal
          if-no-files-found: error
          retention-days: 14
          path: ${{ matrix.workspace }}/dist/mac-smoke/*.dmg

  # Linux x64 and arm64 distribution artifacts: unsigned AppImage, Debian, and
  # tar.gz built on native runners, mirroring the Windows packaging job. The
  # arm64 artifacts must build on an arm64 host because fs-ext is compiled
  # against the target architecture.
  desktop-linux:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: shell-desktop
            arch: x64
            runner: ubuntu-latest
            script: dist:linux
          - workspace: shell-desktop-beta
            arch: x64
            runner: ubuntu-latest
            script: dist:linux
          - workspace: shell-desktop
            arch: arm64
            runner: ubuntu-24.04-arm
            script: dist:linux-arm64
          - workspace: shell-desktop-beta
            arch: arm64
            runner: ubuntu-24.04-arm
            script: dist:linux-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - name: Cache Electron Builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/node-gyp
          key: packaging-downloads-${{ runner.os }}-${{ runner.arch }}-${{ matrix.workspace }}-${{ hashFiles('yarn.lock', format('{0}/package.json', matrix.workspace)) }}
          restore-keys: |
            packaging-downloads-${{ runner.os }}-${{ runner.arch }}-${{ matrix.workspace }}-
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:linux-package
      - name: Build Linux AppImage, Debian, and tar.gz artifacts
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_LINUX_PACKAGE_COMPRESSION: store
        run: yarn workspace ${{ matrix.workspace }} ${{ matrix.script }}
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.workspace }}/dist/*.AppImage
            ${{ matrix.workspace }}/dist/*.deb
            ${{ matrix.workspace }}/dist/*.tar.gz

  # Publish the stable artifacts to a GitHub Release when a version tag is
  # pushed. The build jobs above stay unsigned; macOS signing and notarization
  # remain a separate credentialed step, so the published DMG needs manual
  # Gatekeeper approval.
  publish:
    needs: [desktop-windows, desktop-macos, desktop-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: shell-desktop-windows-x64
          path: release/windows
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: shell-desktop-macos-universal
          path: release/macos
      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: shell-desktop-linux-x64
          path: release/linux-x64
      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: shell-desktop-linux-arm64
          path: release/linux-arm64
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Shell Desktop ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          body: |
            AI Shell Desktop ${{ github.ref_name }}

            Unsigned build artifacts for Windows x64, macOS universal, and
            Linux x64 / ARM64. Windows may warn about an unknown publisher;
            the macOS DMG requires manual approval in Privacy & Security;
            Linux AppImages require FUSE (libfuse2).
          files: release/**/*

  # Upstream toolchain smoke: the portable-shell scripts must resolve the
  # pinned submodule's own Yarn/pnpm release on Windows.
  upstream-command-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn check:layout
      - run: yarn upstream:version
